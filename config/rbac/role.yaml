---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - art.art.local
  resources:
  - artists
  - canvas
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - art.art.local
  resources:
  - artists/finalizers
  - canvas/finalizers
  verbs:
  - update
- apiGroups:
  - art.art.local
  resources:
  - artists/status
  - canvas/status
  verbs:
  - get
  - patch
  - update
