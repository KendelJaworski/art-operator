# This rule is not used by the project art-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the art.art.local.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: art-operator
    app.kubernetes.io/managed-by: kustomize
  name: canvas-editor-role
rules:
- apiGroups:
  - art.art.local
  resources:
  - canvas
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - art.art.local
  resources:
  - canvas/status
  verbs:
  - get
